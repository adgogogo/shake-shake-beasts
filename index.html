<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>震震萌兽 · 一敲全塌</title>
<meta name="theme-color" content="#080b16">
<meta name="description" content="敲一下，冲击波扩散开，整堆萌兽被掀起来互撞，撞得够狠就合成更大一只。敲击次数有限，看你能炸出多少连锁。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ctext y='50' font-size='50'%3E%F0%9F%94%A8%3C/text%3E%3C/svg%3E">
<style>
:root{
  color-scheme:dark;
  --ink:#060910; --surface:#111725; --line:#2a344c;
  --text:#f2f5ff; --muted:#a6b2ce; --mint:#7fffe1; --violet:#a998ff; --warm:#ffc689;
  font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden}
body{
  background:radial-gradient(ellipse at 48% 8%,#1b1631 0,transparent 58%),
    radial-gradient(ellipse at 13% 82%,#091f27 0,transparent 52%),var(--ink);
  color:var(--text); user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
body::before{
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.28;
  background-image:linear-gradient(#ffffff0c 1px,transparent 1px),linear-gradient(90deg,#ffffff0c 1px,transparent 1px);
  background-size:34px 34px; mask-image:radial-gradient(ellipse at center,#000 0,transparent 77%);
}
button{
  color:inherit; font:inherit; cursor:pointer; min-width:0;
  transition:border-color .16s,background-color .16s,box-shadow .16s,transform .16s;
}
button:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
button:not(:disabled):active{transform:scale(.98)}
button:disabled{cursor:not-allowed}
#app{
  position:relative; height:100%; width:min(100%,1060px); margin-inline:auto;
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,500px) minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr); grid-template-areas:"header header header" "readout stage controls";
  column-gap:20px; row-gap:8px;
  padding:calc(env(safe-area-inset-top) + 12px) 18px calc(env(safe-area-inset-bottom) + 16px);
}
.app-header{
  grid-area:header; display:flex; align-items:center; justify-content:space-between;
  min-height:48px; border-bottom:1px solid #202a3d; padding-bottom:8px;
}
.brand{
  display:inline-flex; gap:10px; align-items:center; border:0; background:transparent; padding:0 6px 0 0;
  font-size:16px; font-weight:800; letter-spacing:.04em; border-radius:10px;
}
.brand-mark{
  width:36px; height:36px; display:grid; place-items:center; border-radius:11px;
  background:linear-gradient(145deg,#b3ffe9,#828bfb); color:#091622;
  box-shadow:0 0 22px #659dff44; font-size:20px; line-height:1;
}
.brand .menu-indicator{color:var(--muted);font-size:12px;font-weight:600}
.icon{
  padding:0 12px; min-height:36px; border-radius:9px; border:1px solid var(--line);
  background:#111828; font-size:12px; font-weight:700;
}
.icon:hover,.foot button:hover,.cell:not(:disabled):hover{border-color:#617a9d;background:#1b2640}
.readout{grid-area:readout;min-width:0}
.hud{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pill{
  min-width:0; border:1px solid var(--line); border-radius:12px; padding:11px 12px;
  background:linear-gradient(145deg,#162030,#0e1420); color:var(--muted);
  font-size:13px; font-weight:650; line-height:1.35; font-variant-numeric:tabular-nums;
}
.pill b{color:var(--text)}
.level-stat,#hScorePill{grid-column:1/-1}
.level-stat b{font-size:16px;letter-spacing:.02em}
.stat-label{display:block;font-size:12px;color:var(--muted)}
.score-line{display:flex;align-items:baseline;gap:6px;margin-top:5px}
.score-line b{font-family:Bahnschrift,"Arial",sans-serif;font-size:clamp(30px,4vw,44px);line-height:1}
.score-progress{height:4px;margin-top:11px;border-radius:20px;background:#27324c;overflow:hidden}
.score-progress i{
  display:block; width:0; height:100%; border-radius:inherit;
  background:linear-gradient(90deg,var(--violet),var(--mint)); transition:width .16s ease;
}
.pill.hot{border-color:#526fa0;color:#c9dcff;background:linear-gradient(145deg,#232e56,#152438)}
.pill.low{border-color:#714053;color:#ffb1bf;background:linear-gradient(145deg,#381c32,#1a1626)}
#hTaps .stat-label{margin-bottom:2px}
#hTaps b{font-size:20px;line-height:1}
#hChain{display:grid;align-content:center}
.mode-note{
  margin:10px 0 0; padding:9px 10px; border-left:2px solid var(--violet);
  background:#a998ff12; color:#e3ddff; font-size:12px; line-height:1.55;
}
#stage{
  grid-area:stage; min-width:0; min-height:0; position:relative; display:grid; place-items:center;
  overflow:hidden; touch-action:none; cursor:crosshair;
}
#stage:focus{outline:none}
#stage:focus-visible canvas{filter:drop-shadow(0 0 8px #a998ff46)}
canvas{display:block;max-width:100%;border-radius:18px}
.controls{grid-area:controls;align-self:start;min-width:0}
.tools,.foot{display:grid;gap:8px}
.foot{margin-top:10px}
.tools[hidden]+.foot{margin-top:0}
.tool,.foot button{
  min-height:44px; padding:8px 10px; border-radius:12px; border:1px solid var(--line);
  background:#101726; font-size:13px; font-weight:700;
}
.tool{
  --tool-color:var(--warm);
  display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:8px; text-align:left;
  background:linear-gradient(130deg,color-mix(in srgb,var(--tool-color) 15%,#111727),#101523 72%);
}
.tool[data-tool="magnet"]{--tool-color:#7eeaff}
.tool b{color:var(--tool-color);font-variant-numeric:tabular-nums}
.tool-icon{
  display:grid; place-items:center; width:30px; height:30px; border-radius:8px;
  background:color-mix(in srgb,var(--tool-color) 14%,#111a27); font-size:17px;
}
.tool:hover:not(:disabled),.tool.on{
  border-color:var(--tool-color); box-shadow:0 0 16px color-mix(in srgb,var(--tool-color) 24%,transparent);
}
.tool.on .tool-icon{background:color-mix(in srgb,var(--tool-color) 30%,#111a27)}
.tool:disabled{opacity:.42}
.foot button{color:#c6d0e9}
kbd{margin-left:4px;font:600 10px system-ui;color:var(--muted)}
.overlay{
  position:fixed; inset:0; z-index:500; display:grid; place-items:center; padding:16px;
  background:#050810b5; backdrop-filter:blur(8px);
  opacity:0; visibility:hidden; pointer-events:none; transition:opacity .2s,visibility .2s;
}
.overlay.show{opacity:1;visibility:visible;pointer-events:auto}
.overlay.menu{background:radial-gradient(ellipse at 55% 48%,#121629e6,#050810f7 78%)}
.card{
  --card-accent:var(--violet);
  width:min(410px,100%); max-height:100%; overflow:auto;
  padding:26px; border:1px solid #394463; border-radius:20px; text-align:center;
  background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--card-accent) 18%,transparent),transparent 58%),
    linear-gradient(155deg,#171f32,#0c111e 68%);
  box-shadow:0 24px 84px #01030daa; transform:translateY(10px) scale(.986); transition:transform .22s ease;
  scrollbar-width:thin;
}
.overlay.show .card{transform:none}
.card.win{--card-accent:var(--mint)}
.card.loss{--card-accent:#ff8fae}
.card h1{margin:0 0 7px;font-size:clamp(22px,5vw,29px);letter-spacing:.025em;line-height:1.2}
.card .sub{margin:0;color:#c1cce5;font-size:13px;line-height:1.55}
.card-body{margin-top:12px;color:#c3cce1;font-size:13px;line-height:1.75}
.card-body b,.card .sub b{color:var(--mint)}
.card-actions{display:grid;gap:8px;margin-top:18px}
.btn{
  min-height:44px; padding:10px 12px; border:1px solid #93fff2; border-radius:10px;
  color:#071922; background:linear-gradient(125deg,#afffe4,#76dfed);
  font-size:14px; font-weight:800;
}
.btn:hover{box-shadow:0 0 22px #62f6e343}
.btn.ghost{
  color:#d1dcf4; background:#182238; border-color:#374460; font-weight:650;
}
.btn.ghost:hover{border-color:#6882af;background:#202e4b;box-shadow:none}
.home-card{
  width:min(960px,100%); display:grid; grid-template-columns:minmax(0,1.23fr) minmax(0,1fr);
  align-items:stretch; gap:16px; padding:12px; text-align:left;
  background:#0b101bdc; border-color:#343f5e;
}
.home-hero{
  min-height:460px; position:relative; isolation:isolate; overflow:hidden;
  padding:28px 29px; border:1px solid #3a4867; border-radius:13px;
  background:radial-gradient(ellipse at 53% 65%,#273067 0,#111b36 45%,#0e1323 76%);
}
.home-hero h1{font-size:clamp(34px,6vw,55px);font-weight:900;letter-spacing:.025em}
.home-hero .sub{max-width:290px;color:#ced8f0}
.hero-version{position:absolute;right:14px;bottom:12px;color:#aab8d6;font-size:11px;font-variant-numeric:tabular-nums}
.hero-art{
  position:absolute; z-index:-1; inset:66px 0 0; pointer-events:none;
  background:radial-gradient(ellipse at 52% 53%,#6d56ff5a 0,transparent 54%),
    repeating-linear-gradient(115deg,transparent 0 15px,#90c1ff09 16px 17px,transparent 18px 64px);
}
.hero-orbit{
  position:absolute; left:52%; top:55%; width:var(--diameter); aspect-ratio:1; border-radius:50%;
  border:1px solid #b2c1ff66; border-top-color:#97ffe0; border-bottom-color:#9d82ff9c;
  transform:translate(-50%,-50%) rotate(-27deg) scaleY(.48);
  box-shadow:0 0 22px #8286ff33,inset 0 0 18px #a081ff44;
}
.hero-orbit::after{
  content:""; position:absolute; width:7px; height:7px; border-radius:50%; left:17%; top:12%;
  background:#d8fff5; box-shadow:0 0 16px 4px #85fff1;
}
.hero-orbit.outer{
  --diameter:92%; border-style:dashed; opacity:.5;
  transform:translate(-50%,-50%) rotate(23deg) scaleY(.38);
}
.hero-orbit.inner{--diameter:77%}
.hero-orbit.cross{
  --diameter:63%; border-color:#a9efff6b;
  transform:translate(-50%,-50%) rotate(52deg) scaleY(.47);
}
.hero-orbit.cross::after{left:78%;top:9%;background:#f3caff;box-shadow:0 0 16px 4px #d780ff}
.hero-orb{
  position:absolute; left:var(--x); top:var(--y); width:var(--size); aspect-ratio:1;
  display:grid; place-items:center; border-radius:50%; transform:translate(-50%,-50%);
  border:1px solid color-mix(in srgb,var(--orb-color) 85%,white);
  background:radial-gradient(circle at 29% 22%,#ffffffad,transparent 22%),
    radial-gradient(circle at 39% 31%,color-mix(in srgb,var(--orb-color) 75%,#fff) 0,var(--orb-color) 16%,#25305c 51%,#0c1223 79%);
  box-shadow:inset 0 -6px 18px color-mix(in srgb,var(--orb-color) 50%,transparent),
    0 0 38px color-mix(in srgb,var(--orb-color) 46%,transparent);
  font-family:"Segoe UI Emoji","Apple Color Emoji",sans-serif; font-size:calc(var(--size) * .55);
  animation:orb-float 5s ease-in-out infinite alternate;
}
.hero-orb.dragon{--x:52%;--y:51%;--size:clamp(142px,18vw,214px);--orb-color:#78ffe0}
.hero-orb.fox{--x:25%;--y:66%;--size:clamp(62px,8vw,94px);--orb-color:#ffad80;animation-delay:-2.4s}
.hero-orb.rabbit{--x:78%;--y:33%;--size:clamp(62px,8vw,88px);--orb-color:#d39aff;animation-delay:-1.2s}
.hero-orb.cat{--x:80%;--y:77%;--size:clamp(43px,6vw,66px);--orb-color:#8dc8ff;animation-delay:-3.4s}
@keyframes orb-float{to{transform:translate(-50%,-50%) translateY(-10px)}}
.home-actions{
  display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); align-content:center; align-items:stretch;
  gap:10px; margin:0; padding:12px 12px 12px 0;
}
.home-actions .btn{text-align:left}
.mode-primary{grid-column:1/-1;min-height:62px;padding-inline:16px;font-size:17px}
.mode-tile{
  --mode-accent:var(--violet);
  min-height:82px; padding:11px 12px; border-color:#384866; color:#edf1ff;
  background:linear-gradient(140deg,color-mix(in srgb,var(--mode-accent) 15%,#111825),#111825 75%);
}
.mode-tile.mint{--mode-accent:var(--mint)}
.mode-tile.amber{--mode-accent:#ffc68b}
.mode-tile.pink{--mode-accent:#ff91ca}
.mode-tile:hover{border-color:var(--mode-accent);box-shadow:0 0 20px color-mix(in srgb,var(--mode-accent) 20%,transparent)}
.mode-detail{display:block;margin-top:5px;color:#b7c4df;font-size:11px;font-weight:550;line-height:1.45}
.mode-primary .mode-detail{color:#164b57}
.home-actions .mode-link{min-height:44px;text-align:center;font-size:12px}
.home-actions .span-modes{grid-column:1/-1}
.rules{margin:0;padding:10px 12px;text-align:left;border-radius:10px;background:#101a2b}
.toast{
  position:fixed; left:50%; top:20%; z-index:950; pointer-events:none;
  transform:translate(-50%,5px); opacity:0; max-width:min(90vw,440px);
  padding:9px 15px; border-radius:10px; color:#cbfff2; text-align:center; font-size:13px; font-weight:700;
  background:#10192bf2; border:1px solid #6fdcca70; box-shadow:0 8px 30px #050815b8;
  transition:opacity .18s,transform .18s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.grid,.gal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin:4px 0 8px}
.cell,.gal div{
  aspect-ratio:1; display:grid; place-content:center; gap:2px;
  border:1px solid #394764; border-radius:10px; background:#151e31; color:var(--text);
}
.cell{padding:4px;font-size:15px;font-weight:700}
.cell small{color:var(--warm);font-size:10px;letter-spacing:-.5px}
.cell.locked{opacity:.42}
.cell.best{border-color:#fbd38c;background:#463124}
.gal div{font-size:24px;filter:grayscale(1) brightness(.52)}
.gal div.has{
  filter:none; border-color:#6c7ab0;
  background:radial-gradient(circle at 44% 38%,#49528a,#121a2b 75%);
}
.hint{margin:3px 0 0;color:var(--muted);font-size:12px}
@media(max-width:880px){
  #app{
    width:min(100%,520px); padding:calc(env(safe-area-inset-top) + 6px) 10px calc(env(safe-area-inset-bottom) + 8px);
    grid-template-columns:minmax(0,1fr); grid-template-rows:auto auto minmax(0,1fr) auto;
    grid-template-areas:"header" "readout" "stage" "controls"; gap:6px;
  }
  .app-header{min-height:40px;padding-bottom:5px}
  .brand-mark{width:32px;height:32px;font-size:17px}
  .hud{display:flex;gap:5px}
  .pill{flex:1;padding:7px 4px;text-align:center;font-size:11.5px}
  .level-stat{display:grid;align-content:center}
  .level-stat b{font-size:12px}
  #hScorePill{flex:1.45}
  #hScorePill .stat-label{display:none}
  .score-line{justify-content:center;margin:0;gap:3px}
  .score-line b,#hTaps b{font-size:16px}
  .score-progress{height:3px;margin-top:4px}
  #hTaps .stat-label{display:inline;margin-right:3px}
  .mode-note{padding:3px 7px;margin-top:5px;font-size:11.5px}
  .tools,.foot{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .foot{margin-top:6px}
  .tool,.foot button{padding:5px 8px;min-height:41px;font-size:12px}
  .tool-icon{width:25px;height:25px;font-size:14px}
}
@media(max-width:600px){
  .overlay{padding:10px}
  .home-card{display:block;width:min(430px,100%);padding:8px}
  .home-hero{min-height:215px;padding:15px}
  .home-hero h1{font-size:33px}
  .home-hero .sub{font-size:12px}
  .hero-art{inset:57px -12px -17px}
  .hero-orbit.inner{--diameter:62%}
  .hero-orbit.outer{--diameter:73%}
  .hero-orb.dragon{--size:107px}
  .hero-orb.fox,.hero-orb.rabbit{--size:49px}
  .hero-orb.cat{--size:37px}
  .home-actions{padding:8px 0 0;gap:7px}
  .mode-primary{min-height:47px;padding:8px 10px;font-size:15px}
  .mode-tile{min-height:62px;padding:7px 9px;font-size:12.5px}
  .mode-detail{margin-top:3px}
  .card:not(.home-card){padding:19px}
}
@media(max-height:560px) and (max-width:600px){
  .home-hero{min-height:165px}
  .hero-orb.dragon{--size:81px}
  .hero-orb.fox,.hero-orb.rabbit{--size:38px}
  .hero-orb.cat{--size:30px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<main id="app">
  <header class="app-header">
    <button type="button" class="brand" id="btnHome" aria-label="选择玩法">
      <span class="brand-mark" aria-hidden="true">✦</span>震震萌兽<span class="menu-indicator" aria-hidden="true">⌄</span>
    </button>
    <button type="button" class="icon" id="btnSound" aria-label="音效" aria-pressed="true">🔊 音效</button>
  </header>
  <aside class="readout" aria-label="本局状态">
    <div class="hud">
      <div class="pill level-stat"><b id="hLevel">第 1 关</b></div>
      <div class="pill" id="hScorePill">
        <span class="stat-label">得分</span>
        <div class="score-line"><b id="hScore">0</b><span id="hTarget">/ 0</span></div>
        <div class="score-progress" id="scoreProgress" aria-hidden="true"><i id="scoreFill"></i></div>
      </div>
      <div class="pill" id="hTaps"><span class="stat-label">剩余锤数</span><b>0</b></div>
      <div class="pill" id="hChain">连锁 —</div>
    </div>
    <p class="mode-note" id="modeNote" role="status" hidden></p>
  </aside>
  <div id="stage" tabindex="-1"><canvas id="cv" aria-label="游戏场地，点击或按空格敲击"></canvas></div>
  <aside class="controls" aria-label="敲击工具">
    <div class="tools" id="hammerTools">
      <button type="button" class="tool" id="btnHeavy" data-tool="heavy" title="范围更大、威力更猛" aria-keyshortcuts="1" aria-pressed="false">
        <span class="tool-icon" aria-hidden="true">💥</span>重锤 <b id="hHeavy">1</b>
      </button>
      <button type="button" class="tool" id="btnMagnet" data-tool="magnet" title="将萌兽吸往落点" aria-keyshortcuts="2" aria-pressed="false">
        <span class="tool-icon" aria-hidden="true">🧲</span>磁锤 <b id="hMagnet">1</b>
      </button>
    </div>
    <div class="foot">
      <button type="button" id="btnRestart">重敲本关 <kbd>R</kbd></button>
      <button type="button" id="btnDaily">今日挑战</button>
    </div>
  </aside>
</main>
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" inert>
  <div class="card" id="card"></div>
</div>
<script>
(function(){
'use strict';

/*==PHYS==*/
/* 纯物理核心：不碰 DOM，可抽出来单独跑仿真。allowMerge=false 时只堆叠不合成（用来堆关卡初始局面） */
var VERSION='1.2.1';
var FIELD={W:400,H:620,WALL:8,GRAV:2000,REST:0.12,FRIC:0.24,MAXV:2000,MERGE_V:145};
var CHAIN=[
  {e:'\uD83D\uDC2D',r:14,c1:'#cdfff1',c2:'#4fe6c5'},
  {e:'\uD83D\uDC30',r:19,c1:'#ffd6ff',c2:'#df87fa'},
  {e:'\uD83D\uDC31',r:25,c1:'#d5efff',c2:'#73c5ff'},
  {e:'\uD83D\uDC36',r:32,c1:'#fff1bf',c2:'#ffb96b'},
  {e:'\uD83E\uDD8A',r:40,c1:'#ffdbbd',c2:'#ff8869'},
  {e:'\uD83D\uDC28',r:49,c1:'#eef2ff',c2:'#a9b6ff'},
  {e:'\uD83D\uDC3C',r:59,c1:'#f4f4ff',c2:'#bfbff0'},
  {e:'\uD83D\uDC2F',r:70,c1:'#ffedc4',c2:'#ffaa28'},
  {e:'\uD83E\uDD81',r:82,c1:'#fff0b8',c2:'#ffc234'},
  {e:'\uD83D\uDC32',r:95,c1:'#e2f8ff',c2:'#54c6ff'}
];
var BID=1;
function makeBall(lv,x,y,vx,vy){
  return {id:BID++,lv:lv,r:CHAIN[lv].r,x:x,y:y,vx:vx||0,vy:vy||0,spin:0,age:0,dead:false,squash:0,fresh:false};
}
function integrate(balls,dt){
  for(var i=0;i<balls.length;i++){
    var b=balls[i]; if(b.dead) continue;
    b.vy+=FIELD.GRAV*dt;
    b.vx*=0.9994; b.vy*=0.9994;
    var sp=Math.sqrt(b.vx*b.vx+b.vy*b.vy);
    if(sp>FIELD.MAXV){ b.vx*=FIELD.MAXV/sp; b.vy*=FIELD.MAXV/sp; }
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.spin+=b.vx*dt*0.012;
  }
}
/* 高速接触点供绘制读取。 */
function recordImpact(impacts,x,y,nx,ny,speed,lv,wall){
  if(!impacts||speed<240||impacts.length>=10) return;
  impacts.push({x:x,y:y,nx:nx,ny:ny,speed:speed,lv:lv,wall:wall});
}
function collide(balls,ev,add,allowMerge){
  var n=balls.length, CORR=0.92;
  for(var i=0;i<n;i++){
    var a=balls[i]; if(a.dead) continue;
    for(var j=i+1;j<n;j++){
      var b=balls[j]; if(b.dead) continue;
      var dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d2=dx*dx+dy*dy;
      if(d2>=rr*rr) continue;
      var d=Math.sqrt(d2)||0.0001, nx=dx/d, ny=dy/d, pen=rr-d;
      var rvx=b.vx-a.vx, rvy=b.vy-a.vy, vn=rvx*nx+rvy*ny;      /* vn<0 表示正在靠近 */
      if(allowMerge&&a.lv===b.lv&&a.lv<CHAIN.length-1&&(-vn)>(FIELD.MERGE_V_NOW||FIELD.MERGE_V)){   /* 撞得够狠才合成 */
        a.dead=true; b.dead=true;
        var nl=a.lv+1, mx=(a.x+b.x)*0.5, my=(a.y+b.y)*0.5;
        add.push({id:BID++,lv:nl,r:CHAIN[nl].r,x:mx,y:my,vx:(a.vx+b.vx)*0.5,vy:(a.vy+b.vy)*0.5,spin:0,age:0,dead:false,squash:1,fresh:true});
        ev.merges.push({lv:nl,x:mx,y:my});
        continue;
      }
      var Ma=a.r*a.r, Mb=b.r*b.r, tm=Ma+Mb;
      var wa=Mb/tm, wb=Ma/tm;
      if(a.fresh&&!b.fresh){ wa=0.10; wb=0.90; }        /* 刚合出来的大球自己让位，别把整堆顶飞 */
      else if(b.fresh&&!a.fresh){ wa=0.90; wb=0.10; }
      var push=Math.min(pen*CORR,Math.min(a.r,b.r)*0.85);
      a.x-=nx*push*wa; a.y-=ny*push*wa;
      b.x+=nx*push*wb; b.y+=ny*push*wb;
      if(vn<-4){
        var invSum=1/Ma+1/Mb;
        var j=-(1+FIELD.REST)*vn/invSum, s=Math.min(1,-vn/1400);
        a.vx-=nx*j/Ma; a.vy-=ny*j/Ma;
        b.vx+=nx*j/Mb; b.vy+=ny*j/Mb;
        var tx=-ny, ty=nx, vt=rvx*tx+rvy*ty, jt=-vt/invSum, maxJt=FIELD.FRIC*Math.abs(j);
        jt=Math.max(-maxJt,Math.min(maxJt,jt));
        a.vx-=tx*jt/Ma; a.vy-=ty*jt/Ma;
        b.vx+=tx*jt/Mb; b.vy+=ty*jt/Mb;
        if(s>0.15){ a.squash=Math.max(a.squash,s); b.squash=Math.max(b.squash,s); }
        if(ev.impacts&&vn<-240) recordImpact(ev.impacts,a.x+nx*a.r,a.y+ny*a.r,nx,ny,-vn,Math.max(a.lv,b.lv),false);
      }
    }
  }
}
function walls(balls,impacts){
  var W=FIELD.W,H=FIELD.H,w=FIELD.WALL;
  for(var i=0;i<balls.length;i++){
    var b=balls[i]; if(b.dead) continue;
    if(b.x-b.r<w){
      b.x=w+b.r;
      if(b.vx<0){
        recordImpact(impacts,w,b.y,1,0,-b.vx,b.lv,true);
        b.vx=-b.vx*FIELD.REST;
      }
    }else if(b.x+b.r>W-w){
      b.x=W-w-b.r;
      if(b.vx>0){
        recordImpact(impacts,W-w,b.y,-1,0,b.vx,b.lv,true);
        b.vx=-b.vx*FIELD.REST;
      }
    }
    if(b.y+b.r>H-w){
      b.y=H-w-b.r;
      if(b.vy>0){
        recordImpact(impacts,b.x,H-w,0,-1,b.vy,b.lv,true);
        if(b.vy>60) b.squash=Math.max(b.squash,Math.min(1,b.vy/900));
        b.vy=-b.vy*FIELD.REST;
      }
      b.vx*=0.9;
    }
    if(b.y-b.r<-90){ b.y=-90+b.r; if(b.vy<0) b.vy=0; }
  }
}
function cull(balls){ for(var i=balls.length-1;i>=0;i--) if(balls[i].dead) balls.splice(i,1); }
function physicsStep(balls,dt,ev,allowMerge,passes){
  ev=ev||{}; ev.merges=[];
  if(ev.impacts) ev.impacts.length=0;
  var SUB=3, h=dt/SUB, PASSES=passes||12;
  for(var s=0;s<SUB;s++){
    integrate(balls,h);
    var add=[];
    for(var pi=0;pi<PASSES;pi++) collide(balls,ev,add,allowMerge);
    for(var k=0;k<add.length;k++) balls.push(add[k]);
    walls(balls,ev.impacts);
    cull(balls);
  }
  for(var i=0;i<balls.length;i++){ var b=balls[i]; b.age+=dt; b.fresh=false; if(b.squash>0) b.squash=Math.max(0,b.squash-dt*3.5); }
  return ev;
}
function settled(balls,th){
  for(var i=0;i<balls.length;i++){
    var b=balls[i];
    if(Math.abs(b.vx)>th||Math.abs(b.vy)>th) return false;
  }
  return true;
}
/* 纯位置去重叠：兜底把互相埋住的球推开，保证画面里球是圆的 */
function deOverlap(balls,iters){
  for(var it=0;it<iters;it++){
    var moved=false;
    for(var i=0;i<balls.length;i++){
      for(var j=i+1;j<balls.length;j++){
        var a=balls[i], b=balls[j];
        var dx=b.x-a.x, dy=b.y-a.y, rr=a.r+b.r, d=Math.sqrt(dx*dx+dy*dy)||0.001;
        if(d>=rr) continue;
        var pen=rr-d, nx=dx/d, ny=dy/d, Ma=a.r*a.r, Mb=b.r*b.r, tm=Ma+Mb;
        a.x-=nx*pen*(Mb/tm); a.y-=ny*pen*(Mb/tm);
        b.x+=nx*pen*(Ma/tm); b.y+=ny*pen*(Ma/tm);
        moved=true;
      }
    }
    walls(balls);
    if(!moved) break;
  }
}
/* 出生点是否干净：顶部 120px 内不能有球，否则两只新球会套在一起 */
function spawnClear(balls){
  for(var i=0;i<balls.length;i++) if(balls[i].y-balls[i].r<120) return false;
  return true;
}
function perfectScore(counts){
  var c=counts.slice(), s=0;
  for(var lv=0;lv<c.length-1;lv++){
    var m=Math.floor(c[lv]/2);
    s+=m*((lv+1)*(lv+2)/2);
    c[lv+1]+=m;
  }
  return s;
}

var TOTAL_LEVELS=15;
/* 目标分 = 实测"多种子平均得分 × 50%"，且不超过最差运气的 85%，用 _test.js 的 CALIB=2 标定 */
var TARGETS=[50,55,60,65,115,125,140,160,175,180,185,190,195,200,205];
function planFor(level){
  var lv=Math.max(1,Math.min(TOTAL_LEVELS,level));
  var types=Math.min(5,3+Math.floor(lv/5));                       /* 3 → 5 种：种类少，同款才凑得起来 */
  var per=(lv<=4)?6:6;                                            /* 每种 6 只：球多才有连锁可炸，也压住运气方差 */
  var counts=[],i;
  for(i=0;i<types;i++) counts.push(per);
  var perfect=perfectScore(counts);
  var taps=Math.max(6,12-Math.floor(lv/3));
  var target=TARGETS[lv-1];
  return {counts:counts,perfect:perfect,taps:taps,target:target,count:types*per,types:types,per:per};
}
/* 无尽模式：前 15 波沿用已标定的关卡表，之后目标分每波 ×1.08 复利上涨、敲击次数递减到 5 次 */
var ENDLESS_GROWTH=1.15;   /* 每波目标分 ×1.15：实测机器人在第 30 波上下撞墙，人也差不多 20~30 波 */
var ENDLESS_HAMMER_MODS={
  focused:{label:'小范围强冲击',range:.72,power:1.38},
  wide:{label:'大范围弱冲击',range:1.38,power:.72}
};
function planForEndless(wave){
  var w=Math.max(1,Math.floor(wave));
  var types=Math.min(5,3+Math.floor(w/5));
  var per=6;
  var counts=[],i;
  for(i=0;i<types;i++) counts.push(per);
  var perfect=perfectScore(counts);
  var taps=w<=TOTAL_LEVELS?Math.max(6,12-Math.floor(w/3)):Math.max(5,7-Math.floor((w-TOTAL_LEVELS)/4));
  var target;
  if(w<=TOTAL_LEVELS){ target=TARGETS[w-1]; }
  else{
    target=TARGETS[TOTAL_LEVELS-1];
    for(i=TOTAL_LEVELS+1;i<=w;i++) target=Math.round(target*ENDLESS_GROWTH/10)*10;
  }
  return {counts:counts,perfect:perfect,taps:taps,target:target,count:types*per,types:types,per:per};
}
/* 限时模式：60 秒内随便敲，每 8 秒空投一批小萌兽，拼这一分钟能炸出多少分 */
var TIMED_SECONDS=60, TIMED_BATCH_EVERY=8;
function planForTimed(){
  var counts=[6,6,6];                                   /* 3 种 × 6 只，开局轻快 */
  return {counts:counts,perfect:perfectScore(counts),taps:999,target:0,count:18,types:3,per:6};
}
/* 固定摆位使用场地坐标。每只球依次记录等级、横坐标和纵坐标。 */
var PUZZLES=[

    goal:{lv:2,x:210,y:574,r:38},

  },{

    hint:'在鼓的左侧敲。冲击波扫过鼓，鼓就会在原地再发一道波。'
  }
];
function buildPile(plan){
  var types=plan.counts.length, per=plan.counts[0], list=[], lv, r, i;
  /* 轮流投放，并让每种萌兽落在自己那条竖带上：敲一个区域能带出一串，而不是纯靠运气 */
  for(r=0;r<per;r++) for(lv=0;lv<types;lv++) list.push(lv);
  var pad=FIELD.WALL+44, bw=(FIELD.W-2*pad)/types;
  var balls=[],ev={},dt=1/120;
  for(i=0;i<list.length;i++){
    var t=list[i];
    for(var g=0;g<900;g++){                       /* 等出生点空出来再丢下一只 */
      if(spawnClear(balls)) break;
      physicsStep(balls,dt,ev,false,4);
    }
    var x=pad+t*bw+bw*0.5+(rnd()-0.5)*bw*0.7;
    x=Math.max(pad,Math.min(FIELD.W-pad,x));
    balls.push(makeBall(t,x,30,0,90));
    for(var k=0;k<900;k++){
      physicsStep(balls,dt,ev,false,4);           /* 堆局面时不合成 */
      if(settled(balls,26)) break;
    }
  }
  deOverlap(balls,60);                            /* 兜底：把残余的互相埋住推开 */
  for(var s=0;s<120;s++) physicsStep(balls,dt,ev,false);
  deOverlap(balls,40);
  return balls;
}

/* ================= 敲击：扩散的冲击波 ================= */
/*==GAME2==*/
var WAVE_STYLE={
  normal:{color:'#58ffe0',light:'#c3fff5',width:3.8},
  heavy:{color:'#ff7660',light:'#fff0ad',width:7},
  magnet:{color:'#6a9eff',light:'#bbffff',width:4},
  echo:{color:'#b085ff',light:'#e9d2ff',width:3}
};
/* kind: 不传就是普通敲；'heavy' 重锤（范围/威力更大）；'magnet' 磁锤（把这一圈朝落点吸） */
function knock(x,y,forceKind){
  if(!S||S.over||S.frozen||S.paused||(S.puzzle&&S.puzzle.active)) return;
  var kind=forceKind||S.armed||'normal';
  if(kind==='heavy'&&S.heavy<=0) kind='normal';
  if(kind==='magnet'&&S.magnet<=0) kind='normal';
  if(kind==='normal'){
    if(S.taps<=0) return;
    S.taps--;
  }else if(kind==='heavy'){ S.heavy--; S.armed=null; }
  else { S.magnet--; S.armed=null; S.mergeBoost=1.1; }   /* 磁锤：吸成一团，并且短时间内轻碰也能合体 */
  S.tapsUsed++; lastTapT=S.t;
  var w;
  if(kind==='heavy')       w={x:x,y:y,r:26,max:300,speed:1150,power:1180,dir:1,hit:{},kind:kind};
  else if(kind==='magnet') w={x:x,y:y,r:18,max:265,speed:1000,power:1150,dir:-1,hit:{},kind:kind};
  else                     w={x:x,y:y,r:22,max:205,speed:1080,power:760,dir:1,hit:{},kind:'normal'};
  var mod=kind==='normal'&&S.mode==='endless'?ENDLESS_HAMMER_MODS[S.hammerMod]:null;
  if(mod){ w.max*=mod.range; w.power*=mod.power; }
  if(S.puzzle){
    S.puzzle.active=true;
    S.puzzle.elapsed=0;
    S.puzzle.quietTime=0;
    S.puzzle.drumTriggered=false;
    S.puzzle.lastMerge=null;
  }
  S.waves.push(w);
  addStrikeFx(w);
  S.shake=Math.min(1,S.shake+.55+(kind==='heavy'?.35:0));
  if(kind==='magnet') beep(300,.25,'sine',.12);
  else if(kind==='heavy') beep(70,.35,'sine',.22);
  sfx.tap(); updateHud();
}
function stepWaves(dt){
  var drum=S.puzzle&&S.plan.drum;
  for(var i=S.waves.length-1;i>=0;i--){
    var w=S.waves[i];
    w.r+=w.speed*dt;
    if(drum&&!S.puzzle.drumTriggered&&w.kind!=='echo'&&
       Math.hypot(drum.x-w.x,drum.y-w.y)-drum.r<=Math.min(w.r,w.max)){
      S.puzzle.drumTriggered=true;
      var echo={x:drum.x,y:drum.y,r:12,max:160,speed:880,power:520,dir:1,hit:{},kind:'echo'};
      S.waves.push(echo);
      addStrikeFx(echo);
      beep(270,.22,'triangle',.1);
      updateHud();
    }
    for(var j=0;j<S.balls.length;j++){
      var b=S.balls[j];
      if(w.hit[b.id]) continue;
      var dx=b.x-w.x, dy=b.y-w.y, d=Math.sqrt(dx*dx+dy*dy)||.001;
      if(d-b.r>w.r) continue;                       /* 波前还没扫到它 */
      w.hit[b.id]=1;
      var fall=w.dir<0?Math.max(.15,1-.55*d/w.max):Math.max(0,1-d/w.max);
      if(fall<=0) continue;
      var f=w.power*fall*Math.pow(18/b.r,0.55);
      if(w.dir<0){                                  /* 磁锤：朝落点吸过去 */
        b.vx-=dx/d*f*1.35; b.vy-=dy/d*f*1.35;
      }else{
        b.vx+=dx/d*f; b.vy+=dy/d*f-f*.32;           /* 顺带往上抛一点，看着才爽 */
      }
      b.squash=Math.min(1,b.squash+fall*.7);
    }
    if(w.r>w.max) S.waves.splice(i,1);
  }
}

/* ================= 撞击与合成特效 ================= */
var FX_LIMIT=360;
var motionPreference=typeof matchMedia==='function'?matchMedia('(prefers-reduced-motion: reduce)'):null;
function reducedMotion(){ return motionPreference&&motionPreference.matches; }
function pushFx(effect){
  if(S.fx.length>=FX_LIMIT) S.fx.shift();
  effect.age=0;
  S.fx.push(effect);
}
function addSparks(x,y,color,count,angle,spread,strength){
  /* 特效的随机数独立于开局和空投的随机种子。 */
  var available=Math.min(count,FX_LIMIT-10-S.fx.length);
  for(var i=0;i<available;i++){
    var direction=angle+(Math.random()-.5)*spread;
    var speed=(78+Math.random()*255)*strength;
    pushFx({t:'spark',x:x,y:y,vx:Math.cos(direction)*speed,vy:Math.sin(direction)*speed,
      width:1+Math.random()*2,life:.23+Math.random()*.36,c:i%7===0?'#e8fff9':color,shard:i%5===0});
  }
}
function addStrikeFx(wave){
  if(reducedMotion()) return;
  var color=WAVE_STYLE[wave.kind].color;
  var heavy=wave.kind==='heavy';
  pushFx({t:'flash',x:wave.x,y:wave.y,r:heavy?105:68,life:.21,c:color});
  pushFx({t:'ring',x:wave.x,y:wave.y,r:wave.r,max:wave.max*.73,life:.44,c:color});
  addSparks(wave.x,wave.y,color,heavy?25:13,0,Math.PI*2,heavy?1.45:1);
}
function handleImpacts(){
  var impacts=S.ev.impacts;
  if(!impacts||!impacts.length||reducedMotion()||S.fx.length>FX_LIMIT-32) return;
  for(var i=0;i<impacts.length;i++){
    var hit=impacts[i], strength=Math.min(1,hit.speed/950), color=CHAIN[hit.lv].c2;
    var angle=Math.atan2(hit.ny,hit.nx);
    pushFx({t:'flash',x:hit.x,y:hit.y,r:13+strength*22,life:.095,c:color});
    if(hit.wall){
      addSparks(hit.x,hit.y,color,3+Math.floor(strength*5),angle,2.5,.55+strength);
    }else{
      addSparks(hit.x,hit.y,color,2+Math.floor(strength*3),angle+Math.PI/2,1.35,.55+strength);
      addSparks(hit.x,hit.y,color,2+Math.floor(strength*3),angle-Math.PI/2,1.35,.55+strength);
    }
  }
}
function addScoreLabel(x,y,color,gain,chain){
  x=Math.max(46,Math.min(FIELD.W-46,x));
  y=Math.max(42,y-20);
  for(var i=S.fx.length-1;i>=0;i--){
    var label=S.fx[i];
    if(label.t!=='points'||label.age>.4||Math.abs(label.x-x)>82||Math.abs(label.y-y)>47) continue;
    label.gain+=gain;
    label.chain=chain;
    label.age=Math.min(label.age,.25);
    return;
  }
  pushFx({t:'points',x:x,y:y,life:.8,c:color,gain:gain,chain:chain});
}
function addFx(x,y,lv,gain,chain){
  var beast=CHAIN[lv], color=beast.c2;
  var radius=beast.r+Math.min(chain,6)*3;
  pushFx({t:'ring',x:x,y:y,r:beast.r*.35,max:radius*2.5,life:.48,c:color});
  if(!reducedMotion()){
    pushFx({t:'flash',x:x,y:y,r:radius*2.7,life:.2,c:color});
    addSparks(x,y,color,15+lv*2+Math.min(chain,6),0,Math.PI*2,1.12+lv*.09);
  }
  addScoreLabel(x,y,beast.c1,gain,chain);
}
function handleMerges(){
  var ms=S.ev.merges; if(!ms||!ms.length) return;
  for(var i=0;i<ms.length;i++){
    var m=ms[i];
    if(S.puzzle&&!S.puzzle.solved){
      var goal=S.plan.goal, matches=m.lv===goal.lv;
      var lastMerge=S.puzzle.lastMerge;
      if(matches||!lastMerge||lastMerge.lv!==goal.lv) S.puzzle.lastMerge=m;
      if(matches&&(!S.plan.drum||S.puzzle.drumTriggered)&&Math.hypot(m.x-goal.x,m.y-goal.y)<=goal.r){
        S.puzzle.solved=true;
      }
    }
    S.chain++; S.chainT=1.0; S.merges++;
    var gain=(m.lv*(m.lv+1))/2*S.chain;
    S.score+=gain;
    if(!seen[m.lv]){ seen[m.lv]=1; saveSeen(); }     /* 图鉴点亮 */
    if(m.lv>=CHAIN.length-1){ S.score+=500; gain+=500; S.shake=1; toast('🐲 龙王降临！+500'); }
    S.shake=Math.min(1,S.shake+.2+m.lv*.03);
    addFx(m.x,m.y,m.lv,gain,S.chain);
    sfx.merge(m.lv,S.chain);
  }
  updateHud();
}
function stepFx(dt){
  var count=0;
  for(var i=0;i<S.fx.length;i++){
    var f=S.fx[i]; f.age+=dt;
    if(f.age>=f.life) continue;
    if(f.t==='spark'){
      f.vy+=420*dt;
      f.vx*=1-1.15*dt;
      f.x+=f.vx*dt; f.y+=f.vy*dt;
    }
    S.fx[count++]=f;
  }
  S.fx.length=count;
}
function aliveBalls(){ return S?S.balls.length:0; }
/* 限时模式：从顶上叠着丢一批小萌兽进来（会依次落下） */
function spawnBatch(){
  var pad=FIELD.WALL+44, n=12, i;
  for(i=0;i<n;i++){
    var lv=(rnd()<0.6?0:(rnd()<0.7?1:2));
    S.balls.push(makeBall(lv,pad+rnd()*(FIELD.W-2*pad),20-i*34,0,110));
  }
  S.shake=Math.min(1,S.shake+.25);
  toast('📦 空投！+'+n+' 只');
  beep(520,.12,'triangle',.09);
}
/* 限时模式结算：记录本机前 5 名 */
function endTimed(){
  S.frozen=true; S.settled=true; sfx.clear();
  var list=LS.get('zz_timed',[])||[];
  list.push(S.score); list.sort(function(a,b){return b-a;});
  list=list.slice(0,5);
  LS.set('zz_timed',list);
  var rank=list.indexOf(S.score);
  var html='<div class="rules" style="text-align:center">'+
    list.map(function(v,i){ return (i===0?'🥇':(i===1?'🥈':(i===2?'🥉':'　'+(i+1)+'.')))+'　'+v+' 分'+(v===S.score&&i===rank?'　← 本局':''); }).join('<br>')+
    '</div>';
  showCard({
    title:'⏱ 时间到',
    sub:'这一分钟炸出 <b>'+S.score+'</b> 分',
    body:(rank===0?'🎉 <b>新纪录！</b>':('本机第 '+(rank+1)+' 名'))+'<br>'+html,
    buttons:[{label:'再来一分钟 ▶',cls:'btn',fn:startTimed},
             {label:'炫耀一下成绩',cls:'btn ghost',fn:share},
             {label:'回到首页',cls:'btn ghost',fn:home}]
  });
}

/* ================= 过关 / 失败 ================= */
function stepPuzzle(dt){
  var puzzle=S.puzzle;
  puzzle.elapsed+=dt;
  if(S.waves.length) return;
  puzzle.quietTime=settled(S.balls,35)?puzzle.quietTime+dt:0;
  if(puzzle.quietTime<.15&&puzzle.elapsed<3) return;
  puzzle.active=false;
  updateHud();
  if(puzzle.solved||S.taps===0) finishPuzzle();
}
function finishPuzzle(){
  var puzzle=S.puzzle, level=S.level, name=S.plan.name;
  S.frozen=true;
  S.shake=0;
  if(puzzle.solved){
    sfx.clear();
    puzzlesCleared[level]=true;
    LS.set('zz_puzzles',puzzlesCleared);
    var buttons=[];
    if(level<PUZZLES.length) buttons.push({
      label:'下一题 ▶',fn:function(){ startLevel(level+1,'puzzle'); }
    });
    buttons.push({label:'解谜选关',cls:buttons.length?'btn ghost':'btn',fn:puzzleSelect});
    showCard({
      tone:'win',
      title:'解谜成功 · '+name,
      sub:'用 '+S.tapsUsed+' 锤在圈内合出 '+CHAIN[S.plan.goal.lv].e,
      buttons:buttons
    });
    return;
  }
  sfx.fail();
  showCard({
    tone:'loss',
    title:'再试一个落点',
    sub:puzzle.lastMerge?'已标记这次的合体点':'这一题的锤子用完了',
    body:S.plan.hint,
    buttons:[{label:'原盘重试 ▶',fn:restartLevel},
             {label:'解谜选关',cls:'btn ghost',fn:puzzleSelect}]
  });
}
function clearLevel(){
  S.frozen=true; sfx.clear();
  var bonus=S.taps*15, perfect=(S.balls.length<=1);   /* 省下的敲击换分，但不能盖过本关得分 */
  var playScore=S.score;                              /* 星级只看敲出来的分，不算奖励 */
  var ratio=playScore/Math.max(1,S.target);
  var star=ratio>=2.4?3:(ratio>=1.6?2:1);
  S.stars=star;
  S.score+=bonus;
  if(S.mode==='campaign'&&S.level+1>bestLevel){ bestLevel=Math.min(TOTAL_LEVELS,S.level+1); LS.set('zz_best',bestLevel); }
  if(S.mode==='campaign'&&(!stars[S.level]||stars[S.level]<star)){ stars[S.level]=star; saveStars(); }
  if(S.mode==='daily'){
    var k=todayKey(), r=LS.get('zz_daily',{});
    if(!r[k]||r[k]<S.score){ r[k]=S.score; LS.set('zz_daily',r); }
  }
  if(S.mode==='endless'){
    var total=S.runScore+S.score, wave=S.level, nextWave=wave+1;
    var nextPlan=planForEndless(nextWave), hammerMod=S.hammerMod;
    var body='下一波目标 <b>'+nextPlan.target+'</b> 分，可敲 '+nextPlan.taps+' 次。';
    var buttons;
    if(wave%3===0){
      body+='<br>选一种普通锤改造，在第 '+nextWave+' 到 '+(wave+3)+' 波生效。'+
            '<br>同款扎堆时试试小范围强推，盘面分散时试试大范围轻推。';
      buttons=Object.keys(ENDLESS_HAMMER_MODS).map(function(key){
        return {label:ENDLESS_HAMMER_MODS[key].label+' ▶',fn:function(){ startEndless(nextWave,total,key); }};
      });
    }else{
      buttons=[{label:'下一波 ▶',fn:function(){ startEndless(nextWave,total,hammerMod); }}];
    }
    buttons.push({label:'见好就收（结算）',cls:'btn ghost',fn:function(){ endEndless(total,wave,true); }},
                 {label:'炫耀一下成绩',cls:'btn ghost',fn:share});
    updateHud();
    showCard({
      tone:'win',
      title:'第 '+wave+' 波 · 过了',
      sub:'本波 '+S.score+' 分　总分 <b>'+total+'</b>',
      body:body,
      buttons:buttons
    });
    return;
  }
  updateHud();
  var tail='<br>省下 '+S.taps+' 次敲击 → 奖励 <b>+'+bonus+'</b>'+(perfect?'<br>🧹 <b>整堆敲平了！</b>':'');
  var last=(S.mode==='campaign'&&S.level>=TOTAL_LEVELS);
  if(last){
    var mx=0,i;
    for(i=0;i<S.balls.length;i++) mx=Math.max(mx,S.balls[i].lv);
    showCard({
      tone:'win',
      title:'🏆 '+TOTAL_LEVELS+' 关全敲穿！',
      sub:'总分 '+S.score+' 分 · 最后剩下一只 '+CHAIN[mx].e,
      body:'你把 '+TOTAL_LEVELS+' 关全部敲穿了，最后一关的记录会一直留在首页。'+tail,
      buttons:[{label:'选关刷星',cls:'btn',fn:levelSelect},
               {label:'看萌兽图鉴',cls:'btn ghost',fn:gallery},
               {label:'炫耀一下成绩',cls:'btn ghost',fn:share}]
    });
    return;
  }
  var starTxt='★'.repeat(star)+'☆'.repeat(3-star);
  showCard({
    tone:'win',
    title:'🎉 第 '+S.level+' 关敲穿',
    sub:starTxt+'　得分 '+S.score+'（敲击 '+playScore+' + 奖励 '+bonus+'）',
    body:'目标 '+S.target+' 分，达成 <b>'+ratio.toFixed(2)+' 倍</b>。'+tail,
    buttons:[{label:'下一关 ▶',cls:'btn',fn:function(){ startLevel(S.level+1,'campaign'); }},
             {label:'选关刷星',cls:'btn ghost',fn:levelSelect},
             {label:'炫耀一下成绩',cls:'btn ghost',fn:share}]
  });
}
function failLevel(){
  S.frozen=true; sfx.fail();
  if(S.mode==='endless'){ endEndless(S.runScore+S.score,S.level-1,false); return; }
  showCard({
    tone:'loss',
    title:'锤子用完了 🔨',
    sub:'分数 '+S.score+' / 目标 '+S.target+' · 差 '+(S.target-S.score)+' 分',
    body:'小技巧：落点放在<b>同款最密的地方</b>，波前会一次掀翻好几只，撞在一起就成了连锁；'+
         '留着的敲击次数每次还能换 15 分。',
    buttons:[{label:'再敲一次 ▶',cls:'btn',fn:function(){ startLevel(S.level,S.mode); }},
             {label:'回到首页',cls:'btn ghost',fn:home},
             {label:'炫耀一下成绩',cls:'btn ghost',fn:share}]
  });
}
/* 无尽模式结算：记录"最远波数 + 总分" */
function endlessRecord(){
  var rec=LS.get('zz_endless',null)||{};
  return {wave:rec.wave||0,score:rec.score||0};
}
function endEndless(score,waveCleared,banked){
  var best=endlessRecord();
  var newRecord=false;
  if(waveCleared>best.wave||(waveCleared===best.wave&&score>best.score)){
    best={wave:waveCleared,score:score}; LS.set('zz_endless',best); newRecord=true;
  }
  S.frozen=true; S.settled=true;
  showCard({
    tone:banked?'win':'loss',
    title:banked?'💰 见好就收':'💥 无尽结束',
    sub:'撑过 '+waveCleared+' 波 · 这轮 '+score+' 分'+(newRecord?'　🎉 新纪录！':''),
    body:'历史最好 <b>第 '+best.wave+' 波 · '+best.score+' 分</b>',
    buttons:[{label:'再来一轮 ▶',cls:'btn',fn:startEndless},
             {label:'炫耀一下成绩',cls:'btn ghost',fn:share},
             {label:'回到首页',cls:'btn ghost',fn:home}]
  });
}

/* ================= 主循环 ================= */
var last=0, acc=0;
function frame(ts){
  requestAnimationFrame(frame);
  var dt=(ts-last)/1000; last=ts;
  if(!isFinite(dt)||dt<=0) dt=1/60;
  if(dt>0.05) dt=0.05;
  if(S&&!S.over&&!S.frozen&&!S.paused){
    acc+=dt; var guard=0;
    while(acc>=1/120&&!S.frozen&&guard++<14){
      acc-=1/120;
      if(S.puzzle&&!S.puzzle.active) continue;
      stepWaves(1/120);
      FIELD.MERGE_V_NOW=(S.mergeBoost>0?FIELD.MERGE_V*0.32:FIELD.MERGE_V);   /* 磁锤期间轻碰也能合体 */
      physicsStep(S.balls,1/120,S.ev,true);
      handleMerges();
      handleImpacts();
      if(S.puzzle){
        deOverlap(S.balls,2);
        stepPuzzle(1/120);
      }
    }
    S.t+=dt;
    if(S.mergeBoost>0) S.mergeBoost-=dt;
    if(S.chainT>0){ S.chainT-=dt; if(S.chainT<=0&&S.chain>0){ S.chain=0; updateHud(); } }
    if(!S.puzzle) deOverlap(S.balls,2);
    if(S.mode==='timed'){
      /* 限时模式：只跟时间赛跑，每 TIMED_BATCH_EVERY 秒空投一批 */
      S.timeLeft-=dt;
      var sec=Math.ceil(S.timeLeft);
      if(sec!==S.secShown){ S.secShown=sec; updateHud(); }
      S.nextBatch-=dt;
      if(S.nextBatch<=0){
        S.nextBatch=TIMED_BATCH_EVERY;
        if(S.balls.length<60) spawnBatch();
      }
      if(S.timeLeft<=0) endTimed();
    }else if(!S.puzzle){
      if(S.score>=S.target){ S.endT+=dt; if(S.endT>0.85) clearLevel(); }
      else if(S.taps<=0){
        S.endT+=dt;
        if(settled(S.balls,50)||S.endT>2.8){
          if(S.score>=S.target) clearLevel(); else failLevel();
        }
      }else S.endT=0;
    }
  }
  if(S){
    if(S.shake>0) S.shake=Math.max(0,S.shake-dt*4.2);
    stepFx(dt);
  }
  draw();
}

/* ================= 绘制 ================= */
var TAU=Math.PI*2, arenaTexture=null, orbTextures=[];
function roundRect(context,x,y,w,h,r){
  context.beginPath();
  context.moveTo(x+r,y);
  context.arcTo(x+w,y,x+w,y+h,r); context.arcTo(x+w,y+h,x,y+h,r);
  context.arcTo(x,y+h,x,y,r); context.arcTo(x,y,x+w,y,r);
  context.closePath();
}
function circle(context,x,y,r){
  context.beginPath();
  context.arc(x,y,r,0,TAU);
}
function makeTexture(w,h,paint){
  var texture=document.createElement('canvas');
  texture.width=Math.ceil(w*2); texture.height=Math.ceil(h*2);
  var surface=texture.getContext('2d');
  surface.scale(2,2);
  paint(surface);
  return texture;
}
function paintArena(surface){
  var w=FIELD.W, h=FIELD.H, wall=FIELD.WALL;
  var base=surface.createLinearGradient(0,0,0,h);
  base.addColorStop(0,'#101a2b'); base.addColorStop(.55,'#0d1325'); base.addColorStop(1,'#171334');
  roundRect(surface,wall,wall,w-wall*2,h-wall*2,17);
  surface.fillStyle=base; surface.fill();
  surface.save();
  surface.clip();
  var floor=surface.createRadialGradient(w/2,h,8,w/2,h,250);
  floor.addColorStop(0,'#7258fa55'); floor.addColorStop(1,'#6374ed00');
  surface.fillStyle=floor; surface.fillRect(0,0,w,h);
  surface.beginPath();
  for(var x=wall+24;x<w-wall;x+=24){ surface.moveTo(x,wall); surface.lineTo(x,h-wall); }
  for(var y=wall+24;y<h-wall;y+=24){ surface.moveTo(wall,y); surface.lineTo(w-wall,y); }
  surface.strokeStyle='#7ca6cf19'; surface.lineWidth=1; surface.stroke();

  var centerY=h*.43;
  surface.strokeStyle='#9e9cfb1c';
  for(var radius=62;radius<=134;radius+=36){
    surface.beginPath();
    surface.arc(w/2,centerY,radius,.28,2.8);
    surface.moveTo(w/2+Math.cos(3.42)*radius,centerY+Math.sin(3.42)*radius);
    surface.arc(w/2,centerY,radius,3.42,5.94);
    surface.stroke();
  }
  surface.fillStyle='#0c151f';
  surface.fillRect(wall,h-wall-14,w-wall*2,14);
  surface.fillStyle='#9a86f546';
  for(var stripe=wall+11;stripe<w-wall-12;stripe+=17){
    surface.beginPath();
    surface.moveTo(stripe,h-wall-3); surface.lineTo(stripe+7,h-wall-3);
    surface.lineTo(stripe+14,h-wall-11); surface.lineTo(stripe+7,h-wall-11);
    surface.fill();
  }
  surface.restore();

  roundRect(surface,wall,wall,w-wall*2,h-wall*2,17);
  surface.strokeStyle='#4a5d84'; surface.lineWidth=1; surface.stroke();
  var rail=surface.createLinearGradient(wall,0,w-wall,0);
  rail.addColorStop(0,'#69e9e9'); rail.addColorStop(.5,'#a489ff'); rail.addColorStop(1,'#7ce9ff');
  surface.strokeStyle=rail;
  surface.lineWidth=2;
  surface.lineCap='round';
  surface.shadowColor='#7966ff'; surface.shadowBlur=12;
  surface.beginPath();
  surface.moveTo(wall+18,h-wall-1); surface.lineTo(w-wall-18,h-wall-1);
  surface.moveTo(wall+6,wall+28); surface.lineTo(wall+6,wall+12); surface.lineTo(wall+28,wall+12);
  surface.moveTo(w-wall-6,wall+28); surface.lineTo(w-wall-6,wall+12); surface.lineTo(w-wall-28,wall+12);
  surface.stroke();
}
function orbTexture(level){
  if(orbTextures[level]) return orbTextures[level];
  var beast=CHAIN[level], r=beast.r, edge=r+3;
  orbTextures[level]=makeTexture(edge*2,edge*2,function(surface){
    surface.translate(edge,edge);
    var glass=surface.createRadialGradient(-r*.34,-r*.42,r*.04,r*.05,r*.08,r*1.08);
    glass.addColorStop(0,beast.c1);
    glass.addColorStop(.25,beast.c2);
    glass.addColorStop(.6,'#283658');
    glass.addColorStop(.88,'#101927');
    glass.addColorStop(1,beast.c2);
    circle(surface,0,0,r-.5);
    surface.fillStyle=glass; surface.fill();
    surface.strokeStyle=beast.c2; surface.lineWidth=Math.max(1,r*.045); surface.stroke();
    surface.beginPath(); surface.arc(0,0,r*.89,3.66,4.77);
    surface.strokeStyle='#f7ffffbe'; surface.lineWidth=Math.max(1.2,r*.055); surface.lineCap='round'; surface.stroke();
    surface.beginPath(); surface.arc(0,0,r*.80,.32,1.67);
    surface.strokeStyle=beast.c2+'a8'; surface.lineWidth=Math.max(1.2,r*.054); surface.stroke();
  });
  return orbTextures[level];
}
function drawBall(b){
  var edge=b.r+3, squash=1+b.squash*.19;
  ctx.save();
  ctx.translate(b.x,b.y); ctx.scale(squash,1/squash);
  ctx.drawImage(orbTexture(b.lv),-edge,-edge,edge*2,edge*2);
  ctx.rotate(Math.max(-.36,Math.min(.36,b.spin)));
  ctx.font=Math.round(b.r*1.23)+'px "Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(CHAIN[b.lv].e,0,b.r*.065);
  ctx.restore();
}
function drawTrails(){
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  ctx.lineCap='round';
  for(var i=0;i<S.balls.length;i++){
    var b=S.balls[i], speed=Math.hypot(b.vx,b.vy);
    if(speed<315) continue;
    var length=Math.min(.063,64/speed), x=b.x-b.vx*length, y=b.y-b.vy*length;
    var color=CHAIN[b.lv].c2, tail=ctx.createLinearGradient(x,y,b.x,b.y);
    tail.addColorStop(0,color+'00'); tail.addColorStop(1,color+'ad');
    ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(b.x,b.y);
    ctx.strokeStyle=tail; ctx.lineWidth=Math.max(4,b.r*.7); ctx.stroke();
  }
  ctx.restore();
}
function drawWave(wave){
  var style=WAVE_STYLE[wave.kind], fade=Math.pow(Math.max(0,1-wave.r/wave.max),.58);
  var simple=reducedMotion();
  ctx.save();
  if(!simple){
    ctx.globalCompositeOperation='lighter';
    circle(ctx,wave.x,wave.y,wave.r);
    ctx.strokeStyle=style.color; ctx.lineWidth=style.width*4;
    ctx.globalAlpha=fade*.20; ctx.stroke();
  }
  circle(ctx,wave.x,wave.y,wave.r);
  ctx.strokeStyle=style.light; ctx.lineWidth=simple?2:1+style.width*fade;
  ctx.globalAlpha=fade*.9;
  if(wave.kind==='magnet'||wave.kind==='echo') ctx.setLineDash(wave.kind==='magnet'?[14,8]:[6,7]);
  ctx.stroke();
  if(!simple){
    var ringRadius=wave.r*(wave.kind==='heavy'?.71:.86);
    var phase=wave.r*(wave.kind==='magnet'?-.033:.018);
    ctx.setLineDash([]);
    ctx.beginPath();
    for(var i=0;i<6;i++){
      var a=phase+i*TAU/6;
      ctx.moveTo(wave.x+Math.cos(a)*ringRadius,wave.y+Math.sin(a)*ringRadius);
      ctx.arc(wave.x,wave.y,ringRadius,a,a+(wave.kind==='magnet'?.40:.24));
    }
    ctx.strokeStyle=style.color; ctx.lineWidth=wave.kind==='heavy'?4:2;
    ctx.globalAlpha=fade*.88; ctx.stroke();
  }
  ctx.restore();
}
function drawPuzzleBoard(){
  var puzzle=S.puzzle, goal=S.plan.goal, drum=S.plan.drum;
  ctx.save();
  var color=puzzle.solved?'#91ffd2':'#ffc97c';
  circle(ctx,goal.x,goal.y,goal.r);
  ctx.fillStyle=color+'30'; ctx.fill();
  ctx.strokeStyle=color; ctx.lineWidth=2.6;
  if(!puzzle.solved) ctx.setLineDash([5,4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 15px system-ui,sans-serif';
  ctx.fillStyle=color; ctx.fillText('目标圈',goal.x,goal.y-goal.r-13);
  if(drum){
    circle(ctx,drum.x,drum.y,drum.r);
    ctx.fillStyle=puzzle.drumTriggered?'#614da8':'#211b38'; ctx.fill();
    ctx.strokeStyle=puzzle.drumTriggered?'#fff1ff':'#b08eff'; ctx.stroke();
    ctx.font='22px "Segoe UI Emoji",system-ui,sans-serif';
    ctx.fillText('🥁',drum.x,drum.y+1);
  }
  ctx.restore();
}
function drawPuzzleMark(){
  var puzzle=S.puzzle, mark=puzzle.lastMerge;
  if(puzzle.active||!mark) return;
  ctx.save();
  ctx.fillStyle=puzzle.solved?'#abffe1':'#ffd5e5';
  ctx.strokeStyle='#302138'; ctx.lineWidth=2.5;
  circle(ctx,mark.x,mark.y,6);
  ctx.fill(); ctx.stroke();
  ctx.restore();
}
function drawSpark(effect,fade){
  var speed=Math.hypot(effect.vx,effect.vy)||1;
  var dx=effect.vx/speed, dy=effect.vy/speed;
  var tail=4+Math.min(26,speed*.07)*fade;
  ctx.beginPath();
  ctx.moveTo(effect.x-dx*tail,effect.y-dy*tail);
  ctx.lineTo(effect.x,effect.y);
  ctx.strokeStyle=effect.c; ctx.lineWidth=effect.width*fade+.45;
  ctx.stroke();
  if(effect.shard){
    var width=effect.width*1.8*fade;
    ctx.beginPath();
    ctx.moveTo(effect.x+dx*width*1.55,effect.y+dy*width*1.55);
    ctx.lineTo(effect.x+dy*width,effect.y-dx*width);
    ctx.lineTo(effect.x-dy*width,effect.y+dx*width);
    ctx.fillStyle=effect.c; ctx.fill();
  }
}
function drawEffects(showPoints){
  ctx.save();
  ctx.globalCompositeOperation=showPoints?'source-over':'lighter';
  ctx.lineCap='round';
  for(var i=0;i<S.fx.length;i++){
    var effect=S.fx[i], age=effect.age/effect.life, fade=1-age;
    if((effect.t==='points')!==showPoints) continue;
    if(effect.t==='flash'){
      var radius=effect.r*(.55+age*.61);
      var bloom=ctx.createRadialGradient(effect.x,effect.y,0,effect.x,effect.y,radius);
      bloom.addColorStop(0,'#ffffffb5');
      bloom.addColorStop(.23,effect.c+'7c');
      bloom.addColorStop(1,effect.c+'00');
      ctx.globalAlpha=fade*fade*.67;
      ctx.fillStyle=bloom;
      ctx.fillRect(effect.x-radius,effect.y-radius,radius*2,radius*2);
    }else if(effect.t==='ring'){
      var spread=effect.r+(effect.max-effect.r)*(1-fade*fade);
      circle(ctx,effect.x,effect.y,spread);
      ctx.strokeStyle=effect.c;
      ctx.globalAlpha=fade*.13; ctx.lineWidth=8; ctx.stroke();
      ctx.globalAlpha=fade*.67; ctx.lineWidth=1+2*fade; ctx.stroke();
    }else if(effect.t==='spark'){
      ctx.globalAlpha=fade*.84;
      drawSpark(effect,fade);
    }else if(effect.t==='points'){
      var text='+'+effect.gain, rise=reducedMotion()?0:age*33;
      ctx.globalAlpha=Math.min(1,fade*2.6);
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.font='900 '+(22+Math.min(4,effect.chain))+'px Bahnschrift,system-ui,sans-serif';
      ctx.lineWidth=4; ctx.strokeStyle='#0e1327'; ctx.fillStyle=effect.c;
      ctx.strokeText(text,effect.x,effect.y-rise);
      ctx.fillText(text,effect.x,effect.y-rise);
    }
  }
  ctx.restore();
}
function drawCombo(){
  if(S.chain<3||S.chainT<=0) return;
  var glow=S.chain>=8?'#ffb4f5':'#90ffe3';
  var fade=Math.min(1,S.chainT*3);
  var pulse=reducedMotion()?1:1+Math.max(0,S.chainT-.8)*.6;
  ctx.save();
  ctx.translate(FIELD.W/2,83); ctx.scale(pulse,pulse);
  ctx.globalAlpha=fade; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='900 52px Bahnschrift,system-ui,sans-serif'; ctx.lineJoin='round';
  ctx.fillStyle=glow; ctx.strokeStyle='#0b1021'; ctx.lineWidth=7;
  if(!reducedMotion()){ ctx.shadowColor=glow; ctx.shadowBlur=18; }
  ctx.strokeText('×'+S.chain,0,0);
  ctx.fillText('×'+S.chain,0,0);
  ctx.shadowBlur=0; ctx.font='800 14px system-ui,sans-serif';
  ctx.fillStyle='#e8f2ff'; ctx.fillText('连锁',0,36);
  ctx.restore();
}
function drawAim(){
  var style=WAVE_STYLE[S.armed||'normal'], x=aim.x, y=aim.y;
  ctx.save();
  circle(ctx,x,y,15);
  ctx.strokeStyle=style.color;
  ctx.lineWidth=1.6; ctx.setLineDash([11,7]); ctx.globalAlpha=.9;
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath();
  ctx.moveTo(x-5,y); ctx.lineTo(x+5,y);
  ctx.moveTo(x,y-5); ctx.lineTo(x,y+5);
  ctx.strokeStyle=style.light; ctx.stroke();
  ctx.restore();
}
function draw(){
  ctx.clearRect(0,0,FIELD.W,FIELD.H);
  if(!arenaTexture) arenaTexture=makeTexture(FIELD.W,FIELD.H,paintArena);
  ctx.drawImage(arenaTexture,0,0,FIELD.W,FIELD.H);
  if(!S) return;
  ctx.save();
  var wall=FIELD.WALL;
  roundRect(ctx,wall,wall,FIELD.W-wall*2,FIELD.H-wall*2,17);
  ctx.clip();
  ctx.save();
  if(S.shake>0&&!reducedMotion()){
    ctx.translate(Math.sin(last*.066)*7*S.shake,Math.cos(last*.084)*4*S.shake);
  }
  if(S.puzzle) drawPuzzleBoard();
  for(var w=0;!S.frozen&&w<S.waves.length;w++) drawWave(S.waves[w]);
  if(!reducedMotion()) drawTrails();
  drawEffects(false);
  for(var i=0;i<S.balls.length;i++) drawBall(S.balls[i]);
  drawEffects(true);
  if(S.puzzle) drawPuzzleMark();
  ctx.restore();

  if(!S.frozen&&(!S.puzzle||!S.puzzle.active)&&(S.taps>0||S.armed)) drawAim();
  if(S.mode==='campaign'&&S.level===1&&S.tapsUsed===0&&S.t<8){
    ctx.font='600 14px system-ui,sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='#bdcdeb'; ctx.fillText('点按场地敲击',FIELD.W/2,FIELD.H*.65);
  }
  drawCombo();
  ctx.restore();
}

function toField(clientX,clientY){
  var r=cv.getBoundingClientRect();
  if(!r.width) return null;
  return {x:(clientX-r.left)/r.width*FIELD.W,y:(clientY-r.top)/r.height*FIELD.H};
}
stage.addEventListener('pointermove',function(e){
  var p=toField(e.clientX,e.clientY); if(p){ aim.x=Math.max(4,Math.min(FIELD.W-4,p.x)); aim.y=Math.max(4,Math.min(FIELD.H-4,p.y)); }
});
stage.addEventListener('pointerdown',function(e){
  ac();
  var p=toField(e.clientX,e.clientY);
  if(p&&(!S||!S.puzzle||(p.x>=0&&p.x<=FIELD.W&&p.y>=0&&p.y<=FIELD.H))){
    aim.x=p.x; aim.y=p.y; knock(p.x,p.y);
  }
  e.preventDefault();
});
stage.addEventListener('contextmenu',function(e){ e.preventDefault(); });
document.addEventListener('touchstart',function(){ ac(); },{passive:true});
document.addEventListener('gesturestart',function(e){ e.preventDefault(); });
document.addEventListener('keydown',function(e){
  if(!S) return;
  if(e.key==='Escape'){
    if(overlay.classList.contains('menu')&&overlay.classList.contains('show')&&!S.frozen&&!S.over) hideCard();
    else if(!overlay.classList.contains('show')) home();
    return;
  }
  if(e.key==='r'||e.key==='R'){ restartLevel(); return; }
  if(overlay.classList.contains('show')) return;
  var step=S.puzzle?8:18;
  if(e.key==='ArrowLeft'){ aim.x=Math.max(4,aim.x-step); e.preventDefault(); }
  if(e.key==='ArrowRight'){ aim.x=Math.min(FIELD.W-4,aim.x+step); e.preventDefault(); }
  if(e.key==='ArrowUp'){ aim.y=Math.max(4,aim.y-step); e.preventDefault(); }
  if(e.key==='ArrowDown'){ aim.y=Math.min(FIELD.H-4,aim.y+step); e.preventDefault(); }
  if(e.key===' '||e.key==='Enter'){ knock(aim.x,aim.y); e.preventDefault(); }
  if(e.key==='1'){ armTool('heavy'); e.preventDefault(); }
  if(e.key==='2'){ armTool('magnet'); e.preventDefault(); }
});

    var level=index+1;
    return {
      label:level+' · '+puzzle.name+(puzzlesCleared[level]?' ✓':''),
      fn:function(){ startLevel(level,'puzzle'); }
    };
  });
  buttons.push({label:'回到首页',cls:'btn ghost',fn:home});
  showCard({
    title:'🧩 一锤解谜',
    sub:'在目标圈内合出指定萌兽',
    body:'每题可敲一到两次。等萌兽停稳后再敲下一锤。',
    buttons:buttons
  });
}
function levelSelect(){
  var cells='',i;
  for(i=1;i<=TOTAL_LEVELS;i++){
    var locked=(i>bestLevel), st=stars[i]||0;
    cells+='<button class="cell'+(locked?' locked':'')+(st===3?' best':'')+'" data-lv="'+i+'"'+(locked?' disabled':'')+'>'+
      (locked?'🔒':i)+'<small>'+(locked?'':'★'.repeat(st)+'☆'.repeat(3-st))+'</small></button>';
  }
  showCard({
    title:'🗺️ 选择关卡',
    sub:'已解锁 ' + bestLevel + '/' + TOTAL_LEVELS + ' 关 · 星星可以重打刷新',
    body:'<div class="grid">'+cells+'</div>',
    buttons:[{label:'回到首页',cls:'btn ghost',fn:home}]
  });
  var btns=card.querySelectorAll('.cell[data-lv]');
  for(i=0;i<btns.length;i++){
    (function(el){
      el.addEventListener('click',function(){
        ac();
        var lv=parseInt(el.getAttribute('data-lv'),10);
        if(lv>bestLevel) return;
        startLevel(lv,'campaign');
      });
    })(btns[i]);
  }
}
function gallery(){
  var html='',i,got=0;
  for(i=0;i<CHAIN.length;i++){
    var has=!!seen[i]; if(has) got++;
    html+='<div class="'+(has?'has':'')+'" title="'+CHAIN[i].r+'px">'+CHAIN[i].e+'</div>';
  }
  var dragon=seen[CHAIN.length-1];
  showCard({
    title:'📖 萌兽图鉴',
    sub:'已点亮 '+got+'/'+CHAIN.length+(dragon?' · 🐲 龙王已现世！':' · 🐲 龙王还没出现'),
    body:'<div class="gal">'+html+'</div><div class="hint">合出来的萌兽会永久点亮（存在本机）。越往后越大只，龙王要靠 5 关以后的大堆才敲得出来。</div>',
    buttons:[{label:'回到首页',cls:'btn ghost',fn:home},
             {label:'选关刷星',cls:'btn ghost',fn:levelSelect}]
  });
}

/* ================= 自动敲击（?auto=1，给冒烟测试用） ================= */
(function(){
  if(location.search.indexOf('auto')<0) return;
  var lv=(location.search.match(/lv=(\d+)/)||[])[1];
  var endless=(location.search.indexOf('endless')>=0);
  setTimeout(function(){
    if(location.search.indexOf('timed')>=0) startTimed();
    else if(endless) startEndless(lv?parseInt(lv,10):1,0);
    else startLevel(lv?parseInt(lv,10):1,'campaign');
    var advancing=false;
    setInterval(function(){
      if(!S) return;
      if(S.frozen||S.over||S.settled){
        if(endless&&!S.settled&&!S.over&&!advancing){       /* 无尽：过关后自动进下一波，一直跑到死 */
          advancing=true;
          var nxt=S.level+1, run=S.runScore+S.score;
          var mod=S.level%3===0?'focused':S.hammerMod;
          document.title='AUTO 无尽 第'+nxt+'波 总分'+run+' 球'+S.balls.length;
          setTimeout(function(){ startEndless(nxt,run,mod); advancing=false; },800);
          return;
        }
        document.title='AUTO 结束 '+(endless?('第'+S.level+'波 本轮'+(S.runScore+S.score)+'分'):('L'+S.level+' 分'+S.score+'/目标'+S.target))+' 合成'+S.merges+' 球'+S.balls.length;
        return;
      }
      var bestP=null,bestV=-1,i,j;
      for(i=0;i<S.balls.length;i++){
        var a=S.balls[i],v=0;
        for(j=0;j<S.balls.length;j++){
          if(i===j) continue;
          var b=S.balls[j]; if(b.lv!==a.lv) continue;
          var d=Math.sqrt((a.x-b.x)*(a.x-b.x)+(a.y-b.y)*(a.y-b.y));
          v+=Math.max(0,1-d/190);
        }
        if(v>bestV){ bestV=v; bestP={x:a.x,y:a.y}; }
      }
      if(bestP) knock(bestP.x,bestP.y);
      document.title='AUTO L'+S.level+' 分'+S.score+'/目标'+S.target+' 敲'+S.tapsUsed+' 剩'+S.taps+' 合成'+S.merges+' 球'+S.balls.length;
    },520);
  },500);
})();

/* ================= 启动 ================= */
updateSoundButton();
fit();
home();
requestAnimationFrame(frame);
})();
</script>
